services:
  - type: web
    name: one-click-attendance
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: bash build.sh
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: development
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "true"
